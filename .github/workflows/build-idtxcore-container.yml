name: Build IDTX-Core Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Determine image tag
        id: image-tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: service/idtx-core
          tags: |
            type=sha,event=pr
            type=edge,,event=branch,branch=main
          labels: |
            org.opencontainers.image.title=IDTX-Core
            org.opencontainers.image.description=Immersive Digital Twin Experience: Multi-User Backend
            org.opencontainers.image.vendor=SAP
      
      - name: Show runner disk usage (diagnostic)
        run: |
          echo "Disk usage:" && df -h || true
          echo "Runner cached dir size:" && du -sh /home/runner/actions-runner/cached || true

      - name: Build (PRs — no cache export)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.image-tag.outputs.tags }}
          labels: ${{ steps.image-tag.outputs.labels }}

      - name: Build (main — use registry cache)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.image-tag.outputs.tags }}
          labels: ${{ steps.image-tag.outputs.labels }}
          cache-from: type=registry,ref=service/idtx-core:buildcache
          cache-to: type=registry,ref=service/idtx-core:buildcache,mode=min

      - name: Cleanup runner disk        
        run: |
          echo "Pruning builder and system to free disk space" || true
          docker builder prune -af || true
          docker system prune -af --volumes || true